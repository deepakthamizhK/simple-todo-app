<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple To-Do</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>To-Do</h1>
  <form id="add-form">
    <input id="task" type="text" placeholder="Add a task" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p id="count"></p>
</main>
<script src="app.js"></script>
</body>
</html>
